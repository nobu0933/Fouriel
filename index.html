<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<title>FOURIEL</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<!-- ★ 修正: ホーム画面のコンテナ -->
		<div id="home-screen">
			<!-- ★ 追加: 右上の設定ボタン -->
			<button id="home-settings-btn" onclick="toggleSettings()">
				<i id="homeSettingsIcon" class="fa-solid fa-gear"></i>
				<!-- ★ id="homeSettingsIcon" を追加 -->
			</button>

			<div class="home-content">
				<!-- ★ 修正: 文字を動かせるように分割し、キャンバスを追加 -->
				<h1 id="home-title">
					<div style="display: flex">
						<span class="title-char">F</span>
						<span class="title-char">O</span>
						<span class="title-char">U</span>
						<span class="title-char">R</span>
						<span class="title-char">I</span>
						<span class="title-char">E</span>
						<span class="title-char">L</span>
					</div>
					<span class="version title-char" style="margin-left: 15px">beta. 1.0</span>
				</h1>

				<canvas id="homeWaveCanvas"></canvas>

				<!-- <p>波のリズムに合わせてタップしよう！</p> -->

				<!-- ★ 修正: 3つのモード選択ボタンに変更 -->
				<div class="mode-selection">
					<button class="mode-btn tutorial-btn" onclick="startGame('tutorial')">
						チュートリアル
					</button>
					<button class="mode-btn easy-btn" onclick="startGame('easy')">イージー</button>
					<button class="mode-btn hard-btn" onclick="startGame('hard')">ハード</button>
				</div>
			</div>
		</div>

		<div id="app-container">
			<canvas id="gameCanvas"></canvas>

			<!-- ========================================== -->
			<!-- ★ 修正: オールクリア後に表示されるボタン群 -->
			<!-- ========================================== -->
			<div
				id="clear-buttons-container"
				style="
					display: none;
					position: absolute;
					top: 40%; /* ★ 65% から 45% に変更（波のすぐ下） */
					left: 50%;
					transform: translate(-50%, -50%);
					gap: 30px; /* ★ ボタン同士の間隔も少し広げると見栄えが良くなります */
					z-index: 100;
				"
			>
				<button class="clear-action-btn" onclick="nextProblem()">次の問題</button>
				<button class="clear-action-btn" onclick="goHome()">ホームに戻る</button>
			</div>

			<!-- ★ 修正: グラフキャンバスを div で囲み、閉じるボタンを追加 -->
			<div id="graph-container">
				<button id="closeGraphBtn" onclick="toggleShowGraph()">
					<i class="fa-solid fa-xmark"></i>
				</button>
				<canvas id="graphCanvas"></canvas>
			</div>

			<!-- ★ 追加: 画面左下に配置するグラフ表示ボタン -->
			<button id="showGraphBtn" onclick="toggleShowGraph()">
				<i class="fa-solid fa-chart-simple"></i>
			</button>

			<div id="top-right-controls">
				<button id="pauseBtn" onclick="togglePause()">
					<i id="pauseIcon" class="fa-solid fa-pause"></i>
				</button>
				<button id="homeBtn" onclick="goHome()">
					<i id="homeIcon" class="fa-solid fa-house"></i>
				</button>
				<button id="settingsBtn" onclick="toggleSettings()">
					<i id="settingsIcon" class="fa-solid fa-gear"></i>
				</button>
			</div>

			<!-- ★ 修正: 設定メニューの中身 -->
			<div id="ui-container">
				<button id="nextButton">次の問題に進む</button>

				<div id="msg"></div>

				<div id="ship-selector" class="ship-selector-container">
					<!-- 自機選択ボタンはそのまま -->
					<button class="ship-btn active" data-ship="ship_1.svg">
						<img src="ship_1.svg" alt="Ship 1" />
					</button>
					<button class="ship-btn" data-ship="ship_2.svg">
						<img src="ship_2.svg" alt="Ship 2" />
					</button>
					<button class="ship-btn" data-ship="ship_3.svg">
						<img src="ship_3.svg" alt="Ship 3" />
					</button>
					<button class="ship-btn" data-ship="ship_4.svg">
						<img src="ship_4.svg" alt="Ship 4" />
					</button>
				</div>

				<hr style="width: 100%; border: 0; border-top: 1px solid #dbe9f5; margin: 5px 0" />

				<!-- ========================================== -->
				<!-- ★ 修正: 切り替え項目をトグルスイッチに変更 -->
				<!-- ========================================== -->
				<div class="setting-row">
					<span>線の表示</span>
					<label class="toggle-switch">
						<input
							type="checkbox"
							id="chkShowLine"
							onchange="
								toggleShowLine();
								saveSettings();
							"
						/>
						<span class="toggle-slider"></span>
					</label>
				</div>
				<div class="setting-row">
					<span>円の表示</span>
					<label class="toggle-switch">
						<input
							type="checkbox"
							id="chkShowDot"
							onchange="
								toggleShowDot();
								saveSettings();
							"
						/>
						<span class="toggle-slider"></span>
					</label>
				</div>
				<div class="setting-row">
					<span>船の表示</span>
					<label class="toggle-switch">
						<input
							type="checkbox"
							id="chkShowShip"
							onchange="
								toggleShowShip();
								saveSettings();
							"
						/>
						<span class="toggle-slider"></span>
					</label>
				</div>

				<hr style="width: 100%; border: 0; border-top: 1px solid #dbe9f5; margin: 5px 0" />

				<!-- ★ 修正: Gridレイアウトを使ってスライダーを整列 / 行間は小さめ(row-gap: 6px) -->
				<div
					style="
						display: grid;
						grid-template-columns: auto 1fr;
						row-gap: 6px;
						column-gap: 15px;
						align-items: center;
					"
				>
					<label for="speedSlider">波の速さ</label>
					<input
						type="range"
						id="speedSlider"
						min="200"
						max="600"
						step="100"
						value="400"
						oninput="setWaveSpeed(this.value)"
						onchange="saveSettings()"
					/>

					<label for="lineThicknessSlider">線の太さ</label>
					<input
						type="range"
						id="lineThicknessSlider"
						min="1.5"
						max="5.5"
						step="1.0"
						value="2.5"
						oninput="setLineThickness(this.value)"
						onchange="saveSettings()"
					/>

					<label for="dotSpacingSlider">円の間隔</label>
					<input
						type="range"
						id="dotSpacingSlider"
						min="20"
						max="100"
						step="20"
						value="60"
						oninput="setDotSpacing(this.value)"
						onchange="saveSettings()"
					/>

					<label for="dotRadiusSlider">円の半径</label>
					<input
						type="range"
						id="dotRadiusSlider"
						min="4"
						max="12"
						step="2"
						value="8"
						oninput="setDotRadius(this.value)"
						onchange="saveSettings()"
					/>

					<label for="dotAccentIntervalSlider">濃い円の間隔</label>
					<input
						type="range"
						id="dotAccentIntervalSlider"
						min="2"
						max="10"
						step="2"
						value="6"
						oninput="setDotAccentInterval(this.value)"
						onchange="saveSettings()"
					/>
				</div>

				<hr style="width: 100%; border: 0; border-top: 1px solid #dbe9f5; margin: 5px 0" />

				<!-- ★ 追加: デフォルトに戻すボタン -->
				<button
					onclick="resetSettings()"
					style="background-color: #ffebf0; color: #d93d5e; border-color: #ffccd5"
				>
					設定をデフォルトに戻す
				</button>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
